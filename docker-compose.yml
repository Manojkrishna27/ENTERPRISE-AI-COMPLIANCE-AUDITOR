version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: compliance-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_compliance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_compliance"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: compliance-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: compliance-redis
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compliance-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/contract_compliance
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
      - SECRET_KEY=super-secret-key-change-in-production
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
      - PORT=5000
      - USE_LOCAL_STORAGE=true
      - LOCAL_STORAGE_DIR=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compliance-frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: compliance-nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  backend_uploads:
